spring.application.name=demo

# ===== Server =====
server.port=8080

# ===== Database (MySQL via XAMPP) =====
# Update the database name below to match your existing schema.
spring.datasource.url=jdbc:mysql://localhost:3306/Car_Rental?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# "update" keeps your existing table structure and only adds what's missing.
# Do NOT use "create" or "create-drop" — that would rebuild your tables.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===== JWT =====
# Secret used to sign tokens (HS256 needs at least 32 characters/256 bits).
# Change this value before deploying to production.
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5971
# Expiration time in milliseconds. 86400000 = 24 hours. Example for 1 hour: 3600000
jwt.expiration=86400000